<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
	<meta charset="UTF-8">
	<title>Mi Gestor de Finanzas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/style.css}" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="container mt-5">

<div class="p-3 mb-4 rounded-3 bg-body-tertiary border text-body d-flex justify-content-between align-items-center shadow-sm">

	<div class="user-profile">
		<a th:href="@{/perfil}" style="text-decoration: none; display: flex; align-items: center; gap: 10px;" class="text-reset">
			<img th:src="${usuario?.fotoUrl ?: 'https://via.placeholder.com/40'}" alt="Perfil" class="profile-img rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
			<span th:text="${usuario?.nombre}" class="fw-bold fs-5">Nombre Usuario</span>
		</a>
	</div>

	<div class="d-flex align-items-center gap-2">
		<button class="btn btn-outline-secondary btn-sm" id="btn-theme" type="button">
			<i class="bi bi-moon-fill" id="theme-icon"></i> ☀️/🌜
		</button>

		<form th:action="@{/logout}" method="post" style="margin: 0;">
			<button type="submit" class="btn btn-danger btn-sm">
				Cerrar Sesión
			</button>
		</form>
	</div>

</div>
<div class="container-fluid mt-5">
	<div class="row">

		<div class="col-lg-7">
			<div class="card shadow">
				<div class="card-header bg-primary text-white">
					<h2 class="mb-0">Historial de Ingresos y Egresos</h2>
				</div>
				<div class="card-body">
					
					<form th:action="@{/gastos/nuevo-form}" th:object="${gasto}" method="POST" class="p-3 mb-4 rounded-3 bg-body-tertiary border text-body d-flex justify-content-between align-items-center shadow-sm">
						<div class="col-md-3">
							<label class="form-label small fw-bold">Descripción</label>
							<input type="text" th:field="*{descripcion}"
								   th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"
								   class="form-control" placeholder="¿En qué gastaste?">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
						</div>

						<div class="col-md-2">
							<label class="form-label small fw-bold">Monto</label>
							<div class="input-group has-validation">
								<span class="input-group-text">$</span>
								<input type="number" step="0.01" th:field="*{monto}"
									   th:classappend="${#fields.hasErrors('monto')} ? 'is-invalid' : ''"
									   class="form-control" placeholder="0.00">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('monto')}" th:errors="*{monto}"></div>
							</div>
						</div>

						<div class="col-md-3">
							<label class="form-label small fw-bold">Categoría Kakeibo</label>
							<select th:field="*{categoria}" class="form-select" required>
								<option value="SUPERVIVENCIA">🏠 Supervivencia</option>
								<option value="OCIO">🎮 Ocio (Deseos)</option>
								<option value="CULTURA">📚 Cultura</option>
								<option value="EXTRAS">⚡ Extras (Imprevistos)</option>
							</select>
						</div>

						<div class="col-md-2">
							<label class="form-label small fw-bold">Flujo</label>
							<select th:field="*{tipo}" class="form-select">
								<option value="INGRESO">Ingreso (+)</option>
								<option value="EGRESO">Gasto (-)</option>
							</select>
						</div>

						<div class="col-md-2">
							<button type="submit" class="btn btn-dark w-100">Añadir</button>
						</div>
					</form>

					<div class="table-responsive">
						<table class="table table-hover align-middle">
							<thead class="table-dark">
							<tr>
								<th>Fecha</th>
								<th>Descripción</th>
								<th>Tipo</th>
								<th>Monto</th>
								<th>Categoría</th>
								<th>Acción</th>
							</tr>
							</thead>
							<tbody>
							<tr th:each="g : ${gastos}">
								<td th:text="${g.fecha}"></td>
								<td th:text="${g.descripcion}"></td>
								<td>
									<span th:text="${g.tipo}"
										  th:class="${g.tipo.name() == 'INGRESO' ? 'badge bg-success' : 'badge bg-danger'}">
									</span>
								</td>
								<td th:text="${'$' + #numbers.formatDecimal(g.monto, 1, 2)}"></td>
								<td>
									<span class="badge bg-secondary text-uppercase" th:text="${g.categoria}"></span>
								</td>
								<td>
									<button type="button"
											class="btn btn-outline-danger btn-sm"
											th:onclick="|confirmarBorrado('${g.id}')|">
										Borrar
									</button>
								</td>
							</tr>
							</tbody>
						</table>
					</div>

					<div class="mt-4 p-3 bg-light border text-end">
						<h4>Saldo Actual:
							<span th:text="${'$ ' + #numbers.formatDecimal(saldo, 1, 2)}"
								  th:classappend="${saldo >= 0 ? 'text-success' : 'text-danger'}">
							</span>
						</h4>
					</div>
				</div>
			</div>
		</div>

		<div class="col-lg-5">
			<div class="card shadow mb-4">
				<div class="p-3 mb-4 rounded-3 bg-body-tertiary border text-body d-flex justify-content-between align-items-center shadow-sm">
					<h6 class="m-0 font-weight-bold text-primary text-center">Distribución de Ingresos y Egresos</h6>
				</div>
				<div class="card-body">
					<div style="position: relative; height: 400px; width: 100%;">
						<canvas id="miGraficaDeGastos"></canvas>
					</div>
				</div>
			</div>

			<div class="card bg-info text-white shadow p-3">
				<div class="card-body">
					<h5>Consejo Financiero</h5>
					<p>Recuerda que los <span class="badge bg-danger">Egresos</span> no deben superar el 80% de tus ingresos totales para mantener salud financiera.</p>
				</div>
			</div>
		</div>

	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const htmlElement = document.documentElement;
    const themeBtn = document.getElementById('btn-theme');
    const themeIcon = document.getElementById('theme-icon');

    // 1. Leer si el usuario ya tenía un tema guardado en el navegador
    const temaGuardado = localStorage.getItem('tema') || 'light';
    htmlElement.setAttribute('data-bs-theme', temaGuardado);
    actualizarIcono(temaGuardado);

    // 2. Escuchar el click del botón para alternar el tema
    themeBtn.addEventListener('click', () => {
        const temaActual = htmlElement.getAttribute('data-bs-theme');
        const nuevoTema = (temaActual === 'light') ? 'dark' : 'light';
        
        // Aplicar el tema al HTML
        htmlElement.setAttribute('data-bs-theme', nuevoTema);
        // Guardarlo en el navegador para la próxima visita
        localStorage.setItem('tema', nuevoTema);
        
        actualizarIcono(nuevoTema);
    });

    // Función helper para cambiar el icono según el modo
    function actualizarIcono(tema) {
        if (tema === 'dark') {
            themeIcon.className = 'bi bi-sun-fill'; // Cambia a icono de sol si usas Bootstrap Icons
            // Si usas texto o emojis, aquí puedes cambiar el texto del botón
        } else {
            themeIcon.className = 'bi bi-moon-fill'; // Cambia a icono de luna
        }
    }
</script>
<script th:inline="javascript">
	/*<![CDATA[*/
		document.addEventListener("DOMContentLoaded", function() {
			const etiquetas = /*[[${descripciones}]]*/ [];
			const valores = /*[[${montos}]]*/ [];
			const tipos = /*[[${tipos}]]*/ [];

			console.log("Datos recibidos:", {etiquetas, valores, tipos});

			const canvas = document.getElementById('miGraficaDeGastos');
			if (!canvas) return;

			const coloresFondo = tipos.map(t => t === 'INGRESO' ? 'rgba(40, 167, 69, 0.7)' : 'rgba(220, 53, 69, 0.7)');
			const coloresBorde = tipos.map(t => t === 'INGRESO' ? 'rgba(40, 167, 69, 1)' : 'rgba(220, 53, 69, 1)');

			try {
				const ctx = canvas.getContext('2d');
				new Chart(ctx, {
					type: 'doughnut',
					data: {
						labels: etiquetas,
						datasets: [{
							data: valores,
							backgroundColor: coloresFondo,
							borderColor: coloresBorde,
							borderWidth: 2,
							hoverOffset: 15
						}]
					},
					options: {
						responsive: true,
						maintainAspectRatio: false,
						plugins: {
							legend: { position: 'bottom' }
						}
					}
				});
			} catch (err) {
				console.error("Error al crear la gráfica:", err);
			}
		});
	/*]]>*/
</script>

<script>
	function confirmarBorrado(id) {
		Swal.fire({
			title: '¿Eliminar registro?',
			text: "Esta acción no se puede deshacer",
			icon: 'warning',
			showCancelButton: true,
			confirmButtonColor: '#d33',
			cancelButtonColor: '#3085d6',
			confirmButtonText: 'Sí, borrarlo',
			cancelButtonText: 'Cancelar'
		}).then((result) => {
			if (result.isConfirmed) {
				window.location.href = '/gastos/eliminar/' + id;
			}
		})
	}
    // Si Thymeleaf detecta que llegó un mensaje de error desde el ExceptionHandler
/*<![CDATA[*/
const errorMensaje = /*[[${errorMensaje}]]*/ null;
if (errorMensaje) {
    Swal.fire({
        icon: 'error',
        title: '¡Ups!',
        text: errorMensaje,
        confirmButtonColor: '#3085d6'
    });
}
/*]]>*/
</script>
</body>
</html>
