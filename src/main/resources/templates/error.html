<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Error - Gestor de Finanzas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex align-items-center min-vh-100">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-5 border-danger">
                <div class="card-body">
                    <h1 class="display-1 text-danger fw-bold" th:text="${errorCodigo}">500</h1>
                    <h3 class="mb-3" th:text="${errorTitulo}">Ops, algo salió mal</h3>
                    <p class="text-body-secondary mb-4" th:text="${errorDetalle}">Lo sentimos, el servidor experimentó un error inesperado.</p>
                    <a href="/ver-todo" class="btn btn-primary">Volver al Inicio</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
